services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready succeeds only once Postgres can accept connections, so the
      # backend can wait for "service_healthy" before it tries to connect.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No published ports: the database is reachable only by other services on
    # the internal compose network, never from the LAN. To inspect it from a
    # GUI on this machine, uncomment the localhost-only mapping below.
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Bind to localhost only so the dev API stays on this machine, not the LAN.
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # nginx serves the built app and proxies /api to the backend, so this one
    # port is the whole app. A reverse proxy terminating HTTPS (Caddy, Traefik,
    # nginx...) should point at this container's port 80.
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres-data:
