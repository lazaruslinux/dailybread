# Alembic config. The database URL is NOT here: migrations/env.py reads it
# from the DATABASE_URL environment variable, same as the app itself, so
# secrets stay in .env and out of version control.

[alembic]
script_location = migrations
# Put the backend root on sys.path so env.py can import the app package.
prepend_sys_path = .
# Template for new migration filenames: 0002_add_thing.py style.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
