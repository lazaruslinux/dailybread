# Correctness rules only. Selected explicitly rather than left to ruff's
# defaults: 0.16 widened those to include bugbear, isort and datetimez, which
# turned every FastAPI Depends() argument default into a B008 and failed CI on
# a commit that touched no Python at all. The version is pinned in
# requirements-dev.txt so upgrading is a deliberate act; this list is the
# intent that pin protects.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
