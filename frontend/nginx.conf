# Serves the built frontend and forwards /api/* to the backend container.
# This mirrors the Vite dev proxy: the browser stays same-origin (no CORS),
# and the /api prefix is stripped before the request reaches FastAPI.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The app loads nothing from outside its own origin, so
    # the content-security policy can be strict: everything from here only,
    # inline styles allowed (Framer Motion animates via style attributes),
    # data:/blob: images allowed (icons, the avatar cropper), and nobody may
    # frame the app. nginx quirk: add_header is NOT inherited into a location
    # that sets its own add_header, so every such location below repeats
    # these three lines next to its Cache-Control.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        # Avatar photos straight off a phone can be several MB; nginx's 1 MB
        # default would 413 them before they reach the backend (which enforces
        # its own 12 MB cap). Give the API room for an image upload.
        client_max_body_size 15m;
        # The trailing slashes make nginx replace /api/ with / when proxying,
        # so /api/auth/login becomes /auth/login for the backend.
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app shell and service worker must never be cached hard, or phones
    # would keep running an old version of the app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Vite fingerprints these filenames (index-a1b2c3.js), so their content
    # can never change under the same name: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # SPA fallback: any path that isn't a real file gets index.html, and
    # React's router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
