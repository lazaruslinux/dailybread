# Serves the built frontend and forwards /api/* to the backend container.
# This mirrors the Vite dev proxy: the browser stays same-origin (no CORS),
# and the /api prefix is stripped before the request reaches FastAPI.

# What to tell the backend about the original scheme: an HTTPS-terminating
# proxy in front of this container already says X-Forwarded-Proto: https, and
# that must survive this hop (the backend uses it to mark the session cookie
# Secure); with no proxy in front, our own scheme is the truth.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the big text bodies (the JS bundle, JSON feeds, the wasm
    # decoder); without this the plain-LAN path ships everything raw.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both javascript MIME names: this nginx maps .js to application/javascript
    # but upstream has been moving to text/javascript, and a digest bump must
    # not silently stop compressing the main bundle.
    gzip_types application/json application/javascript text/javascript text/css
               image/svg+xml application/wasm application/manifest+json;

    # Security headers. The app loads nothing from outside its own origin, so
    # the content-security policy can be strict: everything from here only,
    # inline styles allowed (Framer Motion animates via style attributes),
    # data:/blob: images allowed (icons, the avatar cropper), and nobody may
    # frame the app. HSTS is a no-op until HTTPS is actually in play (browsers
    # ignore it on plain http); Permissions-Policy allows only the camera,
    # which the barcode scanner needs, and only for ourselves. nginx quirk:
    # add_header is NOT inherited into a location that sets its own
    # add_header, so every such location below repeats all five lines next to
    # its Cache-Control.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        # Avatar photos straight off a phone can be several MB; nginx's 1 MB
        # default would 413 them before they reach the backend (which enforces
        # its own 12 MB cap). Give the API room for an image upload.
        client_max_body_size 15m;
        # The trailing slashes make nginx replace /api/ with / when proxying,
        # so /api/auth/login becomes /auth/login for the backend.
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The app shell and service worker must never be cached hard, or phones
    # would keep running an old version of the app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # Vite fingerprints these filenames (index-a1b2c3.js), so their content
    # can never change under the same name: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA fallback: any path that isn't a real file gets index.html, and
    # React's router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
